name: Build NuGet package

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Remove previous build results
        shell: bash
        run: rm -rf src/StackedFlow/bin src/StackedFlow/obj artifacts

      - name: Restore dependencies
        run: dotnet restore tsr-StackedFlow.slnx

      - name: Build NuGet package
        run: dotnet build src/StackedFlow/StackedFlow.fsproj --configuration Release --no-restore -p:SolutionDir="$GITHUB_WORKSPACE/"

      - name: Collect NuGet packages
        shell: bash
        run: |
          mkdir -p artifacts
          find src/StackedFlow/bin/Release -maxdepth 1 -type f \( -name '*.nupkg' -o -name '*.snupkg' \) -exec cp {} artifacts/ \;

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
